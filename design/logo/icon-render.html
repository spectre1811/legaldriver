<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:transparent}
  #stage{display:flex;align-items:center;justify-content:center}
  svg text{font-family:Fraunces,Georgia,serif;font-weight:600}
</style>
</head>
<body>
<div id="stage"></div>
<script>
  const p = new URLSearchParams(location.search);
  const size = +(p.get("size")||512);
  const v = p.get("v")||"dark"; // light | dark | maskable
  const stage = document.getElementById("stage");
  stage.style.width = size+"px"; stage.style.height = size+"px";

  const tile = v==="light" ? "#FAF7F1" : "#191926";
  const glyph = v==="light" ? "#191926" : "#FAF7F1";

  let svg;
  if (v==="maskable") {
    // full-bleed ink, glyph+underline in the centre safe zone (~62%)
    svg = `<svg width="${size}" height="${size}" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <rect width="512" height="512" fill="#191926"/>
      <text x="250" y="330" text-anchor="middle" font-size="300" fill="#FAF7F1">p</text>
      <rect x="160" y="338" width="176" height="20" rx="10" fill="#A8823C"/>
    </svg>`;
  } else {
    const border = v==="light" ? `stroke="#191926" stroke-opacity="0.12" stroke-width="2"` : "";
    svg = `<svg width="${size}" height="${size}" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
      <rect x="5" y="5" width="118" height="118" rx="27" fill="${tile}" ${border}/>
      <text x="62" y="94" text-anchor="middle" font-size="94" fill="${glyph}">p</text>
      <rect x="38" y="96" width="52" height="6" rx="3" fill="#A8823C"/>
    </svg>`;
  }
  stage.innerHTML = svg;
  document.fonts.ready.then(()=>{ document.body.setAttribute("data-ready","1"); });
</script>
</body></html>
