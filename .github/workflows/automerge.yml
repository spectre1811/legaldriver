name: automerge

# The free "merge queue" from CI-CD.md Layer 1 — the automated integrator.
# Flow: a worker opens a PR from wt/<WO> → CI runs → a reviewer applies the
# `automerge` label (the "approved to integrate" signal, since GitHub free-private
# can't require reviews/checks server-side) → this workflow merges it into main,
# serially. No agent ever pushes main directly.
#
# Why label-gated: pushing a wt/* branch is frequent + often WIP, so we do NOT
# merge every green PR blindly. The label is the human/reviewer go-ahead; CI green
# is still required. To make a PR auto-land, the reviewer adds the `automerge` label.

on:
  # Fires when the CI workflow finishes. workflow_run always runs the copy of this
  # file on the DEFAULT branch (main), so it must live on main to take effect.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # Re-evaluate the moment the label is applied to an already-green PR.
  pull_request_target:
    types: [labeled]

concurrency:
  # STATIC group → one merge to main at a time. This IS the serialization point
  # (the "one integrator" property) — never cancel an in-flight merge.
  group: integrate-main
  cancel-in-progress: false

permissions:
  contents: write        # merge a PR = a contents write
  pull-requests: write   # read PR state / labels
  checks: read           # read combined check status on the label path
  statuses: read

jobs:
  merge:
    runs-on: [self-hosted, mukadma]
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const fromCI = context.eventName === 'workflow_run';

            // Resolve candidate PR(s) + whether CI is already known-green from the trigger.
            let prNumbers = [];
            if (fromCI) {
              const run = context.payload.workflow_run;
              if (run.conclusion !== 'success' || run.event !== 'pull_request') {
                core.info(`CI run not a successful PR run (conclusion=${run.conclusion}, event=${run.event}) — skip`);
                return;
              }
              // Open PR(s) whose head is exactly this run's head SHA → CI for them is green.
              const list = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 100 });
              prNumbers = list.data.filter(p => p.head.sha === run.head_sha).map(p => p.number);
              if (!prNumbers.length) { core.info(`No open PR at ${run.head_sha.slice(0,9)} — skip`); return; }
            } else {
              if (context.payload.label?.name !== 'automerge') { core.info('label != automerge — skip'); return; }
              prNumbers = [context.payload.pull_request.number];
            }

            for (const number of prNumbers) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              if (pr.state !== 'open' || pr.draft) { core.info(`PR #${number} not an open non-draft — skip`); continue; }
              if (!pr.labels.map(l => l.name).includes('automerge')) { core.info(`PR #${number}: no 'automerge' label — skip (reviewer applies it)`); continue; }

              // CI is known-green on the workflow_run trigger; on the label trigger, verify it.
              let green = fromCI;
              if (!green) {
                const { data: cs } = await github.rest.checks.listForRef({ owner, repo, ref: pr.head.sha });
                const build = cs.check_runs.filter(c => (c.name || '').toLowerCase().includes('build'));
                const relevant = build.length ? build : cs.check_runs;
                green = relevant.length > 0 && relevant.every(c => c.conclusion === 'success');
              }
              if (!green) { core.info(`PR #${number}: checks not all green yet — will retry on CI completion`); continue; }
              if (pr.mergeable === false) { core.warning(`PR #${number}: not mergeable (conflicts) — bounce to author`); continue; }

              await github.rest.pulls.merge({
                owner, repo, pull_number: number,
                merge_method: 'merge',
                commit_title: `integrate: ${pr.head.ref} → main (automerge)`,
                commit_message: pr.title,
              });
              core.notice(`✓ merged PR #${number} (${pr.head.ref})`);
            }
