name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Cancel superseded PR runs (frees the self-hosted runner + faster feedback);
  # never cancel a main build (each merge must be validated).
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: [self-hosted, mukadma]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # WO-132 W2 · fail fast if a data-source-mechanics term (eCourts/NIC/NJDG/scrape/crawl)
      # reappears on a user surface (i18n catalogs or copy-bearing components).
      - run: npm run guard:copy
      # WO-365 W1 · hard-fail if a client component's useTranslations() references a
      # namespace not whitelisted in src/lib/i18n-client-subset.ts (prevents silent
      # raw-key rendering when a namespace is dropped from the RSC payload).
      - run: node scripts/check-i18n-client-namespaces.mjs
      - run: npm run build
        env:
          # Public env needed for the build; non-secret placeholders are fine for compilation.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      # WO-353 W2 · advisory bundle-size budget check — compares .next/static JS total
      # against web-perf-budget.json, emits a ::warning:: if over warn_pct%, always exit 0.
      - run: node scripts/check-bundle-size.mjs
      # WO-365 W1 · hard-fail assertion — measures the serialized JSON size of the
      # client-message subset and exits non-zero if it exceeds the committed
      # rsc-messages-budget.json baseline + warn_pct%.
      - run: node scripts/check-rsc-messages.mjs
      # WO-11 · secret-free test suite (mocked; no network, no .env). Runs INSIDE the
      # `build` job on purpose: automerge's label path only gates on the check whose
      # name contains "build", so tests must ride that check to actually gate merges.
      # DB/RLS + LLM tests are the separate, dormant db-tests.yml (need founder secrets).
      - run: node scripts/run-tests.mjs offline
      # WO-353 W2 · advisory dead-code / unused-dep check (knip). Exit 0 always.
      # Output goes to the job summary; the knip.json ignore list keeps tests,
      # scripts, e2e, and qa-agent out of the report.
      - run: npx knip --no-progress || true
