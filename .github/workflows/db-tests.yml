name: DB Tests

# WO-67 · DB/RLS integration tests on a SELF-CONTAINED, EPHEMERAL local Supabase.
#
# History (the bug this fixes): this job used to point at a long-lived, hand-seeded
# REMOTE throwaway Supabase (the `TEST_ENV_FILE` secret). Nothing ever re-migrated
# that project — so when WO-54 added `matter.tier` to prod, the SEPARATE test DB
# drifted: `matter.tier` was ABSENT there and every DB test died at `p1_smoke`
# ("Could not find the 'tier' column of 'matter'") before reaching its RLS/tenancy
# assertions. The tenant-isolation smoke tests silently stopped protecting anyone.
#
# Fix (drift-proof, secret-free): bring up an EPHEMERAL Supabase on the runner with
# `supabase start`. It applies ALL of `supabase/migrations/*` from a CLEAN STATE on
# every run (drift is impossible) with a fresh PostgREST schema cache, then we seed
# the demo tenant and run the DB group. No `TEST_ENV_FILE`, no remote DB to rot.
# `config.toml` is generated in-CI by `supabase init` so it always matches the
# installed CLI (no committed-config-vs-CLI schema drift; the migrations are the
# only committed contract). See docs/CI.md.
#
# Advisory / post-merge: runs on push to `main` + on demand — NOT on `pull_request`,
# so it never feeds the automerge queue's `build` check. Promote to a required check
# via branch protection to gate merges once desired (docs/CI.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  db-tests:
    # Stays on GitHub-hosted: `supabase start` needs Docker, which doesn't fit the
    # containerized self-hosted runner. Low-frequency (main push only) + advisory
    # (does not gate automerge), so it's cheap on the free tier. See
    # docs/gha-runner-migration-plan.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start ephemeral Supabase (clean migrate + fresh schema cache every run)
        run: |
          # Generate config.toml against the installed CLI (nothing committed to drift).
          [ -f supabase/config.toml ] || supabase init < /dev/null

          # WO-41 deliberately GRANDFATHERS two migrations that share version 0031
          # (0031_email_status_archive + 0031_profile_notification_prefs). Prod applied
          # both via the Supabase Management API, which does NOT key by version, so the
          # repo keeps the pair as-is (see scripts/check-migrations.mjs). But the LOCAL
          # `supabase start` migrator keys supabase_migrations.schema_migrations by the
          # filename version and rejects the duplicate ("schema_migrations_pkey"). Give
          # the later file a unique version in THIS EPHEMERAL CHECKOUT ONLY so the
          # clean-migrate-per-run proceeds WITHOUT reversing WO-41's grandfathered pair
          # in the committed repo. Renumber to 0037 (highest committed numeric is 0036;
          # 0032–0036 are already taken): `notification_prefs` is a LEAF table — nothing
          # else references it and it only depends on profile/tenant (0001) — so applying
          # it later is semantically identical (same SQL, same end state).
          dup=supabase/migrations/0031_profile_notification_prefs.sql
          [ -f "$dup" ] && mv "$dup" supabase/migrations/0037_profile_notification_prefs.sql || true

          # `supabase start` applies every supabase/migrations/*.sql from empty, then
          # brings up Postgres + Auth (GoTrue) + PostgREST with a fresh schema cache.
          supabase start

      - name: Point .env at the local stack
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            # p1_smoke signs in with demo-pass-1234 — seed the demo user with THAT
            # password (seed-demo.ts's default is peshi-demo-1234, which would 401).
            echo "DEMO_PASSWORD=demo-pass-1234"
            echo "CRON_SECRET=ci-cron-secret"
            echo "REPLY_TO=ci@example.test"
          } > .env

      - name: Install deps
        run: npm ci

      - name: Grant Supabase role privileges on public (hosted-parity)
        # Hosted Supabase auto-grants anon/authenticated/service_role on every public
        # table; our migrations rely on that. The local `supabase start` does NOT grant
        # them on migration-created tables, so the service_role hits "permission denied
        # for table …" (which would also mask RLS in the isolation tests — you'd get a
        # grant error, not a row-level denial). Apply the standard grants + default
        # privileges to match hosted, then reload PostgREST so they take effect.
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          grant usage on schema public to anon, authenticated, service_role;
          grant all on all tables in schema public to anon, authenticated, service_role;
          grant all on all sequences in schema public to anon, authenticated, service_role;
          grant execute on all functions in schema public to anon, authenticated, service_role;
          alter default privileges in schema public grant all on tables to anon, authenticated, service_role;
          alter default privileges in schema public grant all on sequences to anon, authenticated, service_role;
          SQL
          psql "$DB_URL" -c "notify pgrst, 'reload schema';" || true

      - name: Seed the demo tenant + user
        run: npx --yes tsx@4.23.0 scripts/seed-demo.ts

      - name: DB / RLS / tenancy tests
        run: node scripts/run-tests.mjs db

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true
