name: DB Tests

# WO-67 · DB/RLS integration tests on a SELF-CONTAINED, EPHEMERAL local Supabase.
#
# History (the bug this fixes): this job used to point at a long-lived, hand-seeded
# REMOTE throwaway Supabase (the `TEST_ENV_FILE` secret). Nothing ever re-migrated
# that project — so when WO-54 added `matter.tier` to prod, the SEPARATE test DB
# drifted: `matter.tier` was ABSENT there and every DB test died at `p1_smoke`
# ("Could not find the 'tier' column of 'matter'") before reaching its RLS/tenancy
# assertions. The tenant-isolation smoke tests silently stopped protecting anyone.
#
# Fix (drift-proof, secret-free): bring up an EPHEMERAL Supabase on the runner with
# `supabase start`. It applies ALL of `supabase/migrations/*` from a CLEAN STATE on
# every run (drift is impossible) with a fresh PostgREST schema cache, then we seed
# the demo tenant and run the DB group. No `TEST_ENV_FILE`, no remote DB to rot.
# `config.toml` is generated in-CI by `supabase init` so it always matches the
# installed CLI (no committed-config-vs-CLI schema drift; the migrations are the
# only committed contract). See docs/CI.md.
#
# Advisory / post-merge: runs on push to `main` + on demand — NOT on `pull_request`,
# so it never feeds the automerge queue's `build` check. Promote to a required check
# via branch protection to gate merges once desired (docs/CI.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start ephemeral Supabase (clean migrate + fresh schema cache every run)
        run: |
          # Generate config.toml against the installed CLI (nothing committed to drift).
          [ -f supabase/config.toml ] || supabase init < /dev/null
          # `supabase start` applies every supabase/migrations/*.sql from empty, then
          # brings up Postgres + Auth (GoTrue) + PostgREST with a fresh schema cache.
          supabase start

      - name: Point .env at the local stack
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            # p1_smoke signs in with demo-pass-1234 — seed the demo user with THAT
            # password (seed-demo.ts's default is peshi-demo-1234, which would 401).
            echo "DEMO_PASSWORD=demo-pass-1234"
            echo "CRON_SECRET=ci-cron-secret"
            echo "REPLY_TO=ci@example.test"
          } > .env

      - name: Install deps
        run: npm ci

      - name: Seed the demo tenant + user
        run: npx --yes tsx@4.23.0 scripts/seed-demo.ts

      - name: DB / RLS / tenancy tests
        run: node scripts/run-tests.mjs db

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true
