name: deploy-prod
on:
  push:
    branches: [main]
concurrency:
  group: deploy-prod
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_z2r1c2s2VX2L84LsRfzymHRw
      VERCEL_PROJECT_ID: prj_7XmMbd0nGa92e5rrC5eIOtzDwzaR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::warning::VERCEL_TOKEN not set — skipping deploy."; exit 0; fi
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" --scope yashbahety90-gmailcoms-projects
