name: deploy-prod
# Server-side deploy on merge to main (INTEGRATION-DEPLOY.md). Serialized by concurrency →
# no alias race. Uses VERCEL_TOKEN (repo secret) → no Vercel GitHub-App connection needed.
on:
  push:
    branches: [main]
concurrency:
  group: deploy-prod
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_z2r1c2s2VX2L84LsRfzymHRw
      VERCEL_PROJECT_ID: prj_7XmMbd0nGa92e5rrC5eIOtzDwzaR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN not set — skipping deploy. Add it in Settings → Secrets and variables → Actions."
            exit 0
          fi
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
