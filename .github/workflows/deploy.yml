name: deploy-prod
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-prod
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel (production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_z2r1c2s2VX2L84LsRfzymHRw
          vercel-project-id: prj_7XmMbd0nGa92e5rrC5eIOtzDwzaR
          vercel-args: '--prod'
          scope: yashbahety90-gmailcoms-projects
